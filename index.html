<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Video</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #stage {
      position: fixed;
      inset: 0; /* Entspricht top:0; right:0; bottom:0; left:0; */
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #stage video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      /* Verhindert falsche Layout-Szenarien durch Aspect-Ratio-Reflows */
      aspect-ratio: 720 / 1280; 
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>

<div id="stage">
  <!-- width und height Attribute hier bewusst weglassen -->
  <video src="video.mp4" 
         poster="poster.jpg" 
         controls 
         playsinline 
         preload="metadata" 
         controlsList="nodownload noplaybackrate" 
         disablePictureInPicture></video>
</div>

</body>
</html>
