<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Video</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  body{
    height:100vh;      /* Fallback für alte Browser */
    height:100svh;     /* moderne Browser: kleinste Viewport-Höhe */
    display:flex;align-items:center;justify-content:center;
  }
video{max-width:100%;max-height:100%;object-fit:contain;background:#000}  
</style>
</head>
<body>
<video src="video.mp4" poster="poster.jpg" controls playsinline
       preload="metadata" controlsList="nodownload noplaybackrate"
       disablePictureInPicture></video>
</body>
</html>
