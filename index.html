<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Video</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;
    overscroll-behavior:none;height:100%}
  #stage{
    position:fixed; top:0; left:0;
    width:100%;
    height:100vh;            /* Fallback */
    height:100svh;           /* moderne Browser */
    height:var(--vh, 100svh);/* exakter Wert per JS */
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  video{
    display:block;
    max-width:100%; max-height:100%;
    aspect-ratio:720/1280;   /* verhindert den Sprung */
    object-fit:contain; background:#000;
  }
</style>
</head>
<body>
<div id="stage">
  <video src="video.mp4" poster="poster.jpg" width="720" height="1280"
         controls playsinline preload="metadata"
         controlsList="nodownload noplaybackrate"
         disablePictureInPicture></video>
</div>
<script>
  const set = () => {
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--vh', h + 'px');
  };
  set();
  addEventListener('resize', set);
  addEventListener('orientationchange', () => setTimeout(set, 200));
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', set);
    visualViewport.addEventListener('scroll', set);
  }
</script>
</body>
</html>
